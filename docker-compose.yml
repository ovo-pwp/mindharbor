name: mindharbor

services:
  mysql:
    image: mysql:8.0
    container_name: mindharbor-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-mindharbor123}
      MYSQL_DATABASE: mindharbor
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-mindharbor123}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - mindharbor

  redis:
    image: redis:7-alpine
    container_name: mindharbor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - mindharbor

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindharbor/app:1.0.0
    container_name: mindharbor-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mindharbor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindharbor123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - mindharbor

volumes:
  mysql-data:
  redis-data:

networks:
  mindharbor:
    driver: bridge
